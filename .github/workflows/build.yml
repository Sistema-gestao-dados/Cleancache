name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Gerar o APK
        run: gradle assembleDebug --no-daemon

      - name: Publicar no Releases (link fixo para baixar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LimpaCache.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LimpaCache.apk --title "Limpa Cache" --notes "APK mais recente" --target "${{ github.sha }}"

      - name: Guardar o APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: LimpaCache-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
